<!-- @dsCard group="Components" viewport="700x400" name="Content" subtitle="Foto, tarjeta de proyecto y portada editorial" -->
<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-body);}</style>
</head>
<body><div id="root" style="padding:28px 32px;"></div>
<script type="text/babel" data-presets="react">
const NS = Object.values(window).find(v => v && typeof v === "object" && v.ProjectCard) || {};
const { ProjectCard, PhotoFrame } = NS;
const I = "../../assets/img/";
ReactDOM.createRoot(document.getElementById("root")).render(
  <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"24px"}}>
    <ProjectCard index={1} title="Serie nocturna" year="2025" category="Fotografía" cover={I+"p-duo-bw.jpeg"} ratio="4 / 5" />
    <ProjectCard index={2} title="Dirección de arte" year="2024" category="Identidad" cover={I+"p-duo-magenta.jpeg"} ratio="4 / 5" />
    <PhotoFrame src={I+"p-guitar.jpeg"} ratio="4 / 5" caption="Retrato" veil="soft" />
  </div>
);
</script></body></html>
