<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-body);}</style>
</head>
<body><div id="root" style="padding:28px 32px;"></div>
<script type="text/babel" data-presets="react">
const NS = Object.values(window).find(v => v && typeof v === "object" && v.Button && v.TagList) || {};
const { Button, TagList, SectionLabel, Rule } = NS;
ReactDOM.createRoot(document.getElementById("root")).render(
  <div style={{display:"flex",flexDirection:"column",gap:"26px"}}>
    <div style={{display:"flex",gap:"14px",flexWrap:"wrap",alignItems:"center"}}>
      <Button variant="solid">Contactar</Button>
      <Button variant="outline">Ver proyectos</Button>
      <Button variant="accent" size="sm">Descargar CV</Button>
      <Button variant="ghost">Leer más</Button>
      <Button variant="outline" disabled>Agotado</Button>
    </div>
    <TagList items={["Fotografía","Diseño gráfico","Identidad visual","Dirección de arte"]} />
    <SectionLabel>Proyectos seleccionados</SectionLabel>
    <div style={{display:"flex",flexDirection:"column",gap:"14px"}}>
      <Rule accent />
      <Rule />
    </div>
  </div>
);
</script></body></html>
