<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-body);padding:22px 26px;}</style>
</head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;">
  
  <div><div style="position:relative;aspect-ratio:4/5;overflow:hidden;">
    <img src="../assets/img/p-walk-sunset.jpeg" style="width:100%;height:100%;object-fit:cover;filter:contrast(1.06) saturate(0.96);">
    
  </div><div style="margin-top:8px;font-family:var(--font-display);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);">Sin velo</div></div>
  <div><div style="position:relative;aspect-ratio:4/5;overflow:hidden;">
    <img src="../assets/img/p-duo-bw.jpeg" style="width:100%;height:100%;object-fit:cover;filter:contrast(1.06) saturate(0.96);">
    <span style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,10,0) 55%,rgba(10,10,10,0.92) 100%);"></span>
  </div><div style="margin-top:8px;font-family:var(--font-display);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);">Velo inferior</div></div>
  <div><div style="position:relative;aspect-ratio:4/5;overflow:hidden;">
    <img src="../assets/img/p-duo-magenta.jpeg" style="width:100%;height:100%;object-fit:cover;filter:contrast(1.06) saturate(0.96);">
    <span style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,8,8,0.86) 0%,rgba(8,8,8,0.12) 70%);"></span>
  </div><div style="margin-top:8px;font-family:var(--font-display);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);">Velo lateral</div></div>
  <div><div style="position:relative;aspect-ratio:4/5;overflow:hidden;">
    <img src="../assets/img/p-guitar.jpeg" style="width:100%;height:100%;object-fit:cover;filter:contrast(1.06) saturate(0.96);">
    <span style="position:absolute;inset:0;background:rgba(10,10,10,0.45);"></span>
  </div><div style="margin-top:8px;font-family:var(--font-display);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);">Velo plano</div></div>
</div></body></html>
