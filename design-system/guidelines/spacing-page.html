<!-- @dsCard group="Spacing" viewport="700x180" name="Márgenes de página" subtitle="--page-x y --gutter, fluidos" -->
<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-body);padding:22px 26px;}</style>
</head><body>
<div style="border:1px solid var(--rule-soft);height:120px;display:grid;grid-template-columns:1fr 1fr;position:relative;">
  <div style="border-right:1px dashed var(--accent-dim);"></div><div></div>
  <div style="position:absolute;inset:0;padding:0 var(--page-x);pointer-events:none;">
    <div style="height:100%;border-left:1px solid var(--accent);border-right:1px solid var(--accent);"></div>
  </div>
</div>
<div style="margin-top:12px;font-size:11px;color:var(--text-muted);">--page-x: clamp(24px, 7.8vw, 150px) · --gutter: clamp(28px, 5vw, 96px)</div>
</body></html>
